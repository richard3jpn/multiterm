[package]
name = "multiterm-backend"
version = "1.0.0"
edition = "2021"
rust-version = "1.85"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "process"] }
tower-http = { version = "0.6", features = ["cors"] }
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
time = { version = "0.3", features = ["formatting"] }
regex = "1"
memchr = "2"
encoding_rs = "0.8"
futures-util = "0.3"
# リソース計測（RDD 17章）。プロセスのCPU・メモリだけ使うので system 以外は落とす
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
# フロントのビルド成果物をバイナリへ埋め込む（単一exe化）
rust-embed = "8"
mime_guess = "2"

# GPU使用率（RDD 17.6章）。PDHのカウンタを読むためだけに使う。
# sysinfo はGPUを扱わず、内蔵GPUではベンダー固有ツールも使えないため、OSのカウンタを読む
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_System_Performance"] }

# リリースビルドの設定はワークスペースルートの Cargo.toml にある
# （workspace ではメンバー側の [profile] が無視されるため）
