[package]
name = "multiterm-backend"
version = "1.0.0"
edition = "2021"
rust-version = "1.85"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "process"] }
tower-http = { version = "0.6", features = ["cors"] }
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
time = { version = "0.3", features = ["formatting"] }
regex = "1"
memchr = "2"
encoding_rs = "0.8"
futures-util = "0.3"
# フロントのビルド成果物をバイナリへ埋め込む（単一exe化）
rust-embed = "8"
mime_guess = "2"

# 軽量化（RDD 3章）: サイズと実行速度を優先したリリースビルド
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
